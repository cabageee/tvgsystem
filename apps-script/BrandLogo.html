    const favicon = document.querySelector('link[data-tvg-brand-favicon]');
    if (favicon) favicon.href = logoUrl;
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', applyLogo, { once: true });
  } else {
    applyLogo();
  }
})();
</script>
